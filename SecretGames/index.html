		<script>
			(() => {
			const gameHolder = document.querySelectorAll('.linkgames');
			let gameDirectories;
			let gameNames;
			//gameDirectories = ["Games/FishingGame", "Games/FunThings", "Games/MultiplayerDemo"];
			//const gameNames = ["Fishing Game", "Fun Things", "Multiplayer Test"];

			let newLink
			for (let i of gameHolder){
				gameDirectories = i.getAttribute("data-directories").split("|");
				gameNames = i.getAttribute("data-names").split("|");

				for (let directory of gameDirectories){
					newLink = document.createElement('a');
					newLink.classList.add("gameLink")
					if (gameNames[gameDirectories.indexOf(directory)] != 'none'){
						newLink.text = gameNames[gameDirectories.indexOf(directory)];
					}
					newLink.href = "/Zach/game_files/offline/" + directory
					
					
					i.appendChild(newLink);

				}
			}
			})();
