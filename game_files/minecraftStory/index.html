<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft: Story Mode</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:Rubik;src:url(rubik.woff2) format("woff2");font-weight:300 900;font-display:block}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#canvas{--aspect:1.7777778;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*var(--aspect)));height:min(100vh,calc(100vw/var(--aspect)));background:#000;display:block;outline:none;cursor:none}
#start{--w:min(100vw,177.7778vh);--h:calc(var(--w)*.5625);position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:#6c8fdb url(backdrop.jpg) center/cover no-repeat;color:#fff;font:500 18px Rubik,system-ui,sans-serif;cursor:pointer}
#start:disabled{cursor:progress}
#start.hidden{display:none}
#logo{position:absolute;left:50%;top:calc(50% - var(--h)*.061);width:calc(var(--w)*.718);transform:translate(-50%,-50%);user-select:none;pointer-events:none}
#status{position:absolute;left:0;right:0;top:calc(50% + var(--h)*.218 - .6em);margin:0 auto;width:max-content;max-width:92vw;font-size:max(15px,calc(var(--h)*.032));line-height:1.2;letter-spacing:.02em;text-align:center;text-shadow:0 2px 6px rgba(10,20,50,.75),0 0 2px rgba(10,20,50,.9)}
#options{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);width:max-content;max-width:92vw;box-sizing:border-box;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;padding:12px 18px;border-radius:10px;background:rgba(10,14,24,.66);color:#c9d2e6;font:13px Rubik,system-ui,sans-serif;font-size:clamp(13px,1.6vh,20px)}
#options.hidden{display:none}
#options label{display:flex;flex-direction:column;gap:4px}
#options select{background:#111;color:#ddd;border:1px solid #333;border-radius:4px;padding:5px 8px;font:inherit;cursor:pointer}
#options select:disabled{color:#666;cursor:default}
</style>
<script src="MinecratStory_files/fmodstudio_VLyc.js"></script></head>
<body>
<canvas id="canvas" width="1920" height="1080" tabindex="0" style="--aspect: 1.7777777777777777; cursor: none;"></canvas>
<button id="start" disabled="disabled" class="hidden"><img id="logo" src="MinecratStory_files/logo_VLyc.png" alt="Minecraft: Story Mode WASM Edition" draggable="false"><span id="status">Click to start</span></button>
<div id="options" class="hidden">
<label>Quality<select id="option-quality"><option value="auto" selected="selected">Auto (high)</option><option value="4k">4K (3840x2160)</option><option value="ultra">Ultra (1440p to 1080p)</option><option value="high">High (1080p)</option><option value="medium">Medium (900p)</option><option value="low">Low (720p)</option><option value="minimum">Minimum (540p)</option></select></label>
<label>Frame rate<select id="option-fps"><option value="60" selected="selected">60 fps</option><option value="uncapped">Unlimited</option></select></label>
<label>Anti-aliasing<select id="option-aa"><option value="smooth" selected="selected">Smooth</option><option value="sharp">Sharp</option></select></label>
<label>Shadows<select id="option-shadows"><option value="auto" selected="selected">Auto</option><option value="on">On</option><option value="off">Off</option></select></label>
<label>Multithreading<select id="option-threads"><option value="on" selected="selected">On</option><option value="off">Off</option></select></label>
</div>
<script src="MinecratStory_files/quality_VLyc.js"></script>
<script src="MinecratStory_files/filesystem_VLyc.js"></script>
<script src="MinecratStory_files/audio_VLyc.js"></script>
<script src="MinecratStory_files/loader_VLyc.js"></script><script src="MinecratStory_files/mcsm_mt_VLyc.js"></script>


</body></html>
